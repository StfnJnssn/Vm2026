  try {
    const d = new Date(utc);
    if (mode === 'time') return d.toLocaleTimeString('sv-SE', {timeZone:'Europe/Stockholm',hour:'2-digit',minute:'2-digit'});
    if (mode === 'date') return d.toLocaleDateString('sv-SE', {timeZone:'Europe/Stockholm',weekday:'short',day:'numeric',month:'short'});
    return d.toLocaleString('sv-SE', {timeZone:'Europe/Stockholm',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  } catch(e) { return utc; }
}

function badge(ch) {
  return `<span class="badge badge-${ch.toLowerCase()}">${ch}</span>`;
}

function computeStandings() {
  const groups = {};
  MATCHES.forEach(m => {
    if (!m.group || !m.ft) return;
    if (!groups[m.group]) groups[m.group] = {};
    const [s1,s2] = m.ft;
    [[m.team1,s1,s2],[m.team2,s2,s1]].forEach(([name,gf,ga]) => {
      if (!groups[m.group][name]) groups[m.group][name] = {name,p:0,w:0,d:0,l:0,gf:0,ga:0};
      const t = groups[m.group][name];
      t.p += gf>ga?3:gf===ga?1:0;
      t.w += gf>ga?1:0; t.d += gf===ga?1:0; t.l += gf<ga?1:0;
      t.gf += gf; t.ga += ga;
    });
  });
  const result = {};
  Object.entries(groups).forEach(([g,teams]) => {
    result[g] = Object.values(teams).sort((a,b) => {
      if (b.p!==a.p) return b.p-a.p;
      if ((b.gf-b.ga)!==(a.gf-a.ga)) return (b.gf-b.ga)-(a.gf-a.ga);
      return b.gf-a.gf;
    });
  });
  return result;
}

let activeTab = 'results';
let activeFilter = {'results':'Alla','upcoming':'Alla'};

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['results','upcoming','groups'][i]===tab);
  });
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('filters-results').style.display = tab==='results'?'flex':'none';
  document.getElementById('filters-upcoming').style.display = tab==='upcoming'?'flex':'none';
}

function setFilter(tab, grp) {
  activeFilter[tab] = grp;
  renderAll();
}

function matchRow(m) {
  const hasSwe = isSwe(m.team1)||isSwe(m.team2);
  const hasScore = m.ft!==null && m.ft!==undefined;
  const grp = m.group ? m.group.replace('Group ','Gr ') : '';
  return `
    <div class="match-row ${hasSwe?'sweden':'normal'}">
      <div class="match-time">
        <div class="match-date">${sweTime(m.utc,'date')}</div>
        <div class="match-status ${hasScore?'ft':'upcoming'}">${hasScore?'FT':sweTime(m.utc,'time')}</div>
      </div>
      <div class="match-teams">
        <span class="team-name left ${isSwe(m.team1)?'bold':''}">${isSwe(m.team1)?'🇸🇪 ':''}${m.team1}</span>
        <div class="score-box ${hasScore?'has-score':'no-score'}">
          ${hasScore?`<span class="score-val">${m.ft[0]}–${m.ft[1]}</span>`:'<span class="score-empty">–</span>'}
        </div>
        <span class="team-name right ${isSwe(m.team2)?'bold':''}">${isSwe(m.team2)?'🇸🇪 ':''}${m.team2}</span>
      </div>
      <div class="match-meta">
        ${grp?`<span class="match-group">${grp}</span>`:''}
        ${m.ch?badge(m.ch):''}
      </div>
    </div>`;
}

function renderBanner() {
  const swMatches = MATCHES.filter(m => isSwe(m.team1)||isSwe(m.team2));
  const played = swMatches.filter(m => m.ft);
  const upcoming = swMatches.filter(m => !m.ft).sort((a,b)=>new Date(a.utc)-new Date(b.utc));
  const next = upcoming[0];
  let html = `<div class="swe-banner"><div class="swe-stripe1"></div><div class="swe-stripe2"></div><div class="swe-inner">
    <div class="swe-title">🇸🇪 SVERIGE – GRUPP F</div>`;
  if (next) {
    html += `<div class="swe-next">
      <span class="swe-matchname">${isSwe(next.team1)?'🇸🇪 ':''}${next.team1}<span style="color:#4b5563;margin:0 6px;font-weight:400">–</span>${isSwe(next.team2)?'🇸🇪 ':''}${next.team2}</span>
      ${badge(next.ch)}
      <span style="color:#9ca3af;font-size:0.8rem">${sweTime(next.utc,'full')}</span>
    </div>
    <div class="swe-countdown">⏱ <span class="countdown" data-utc="${next.utc}">...</span></div>`;
  } else {
    html += '<div style="color:#6b7280">Gruppspelet avslutat</div>';
  }
  if (played.length) {
    html += '<div class="swe-results">';
    played.forEach(m => {
      const sh = isSwe(m.team1);
      const sw = sh?m.ft[0]:m.ft[1], op = sh?m.ft[1]:m.ft[0];
      const res = sw>op?'V':sw===op?'O':'F';
      const col = res==='V'?'#16a34a':res==='O'?'#ca8a04':'#dc2626';
      html += `<div class="swe-result"><span class="res-badge" style="background:${col}">${res}</span>${m.team1} ${m.ft[0]}–${m.ft[1]} ${m.team2}</div>`;
    });
    html += '</div>';
  }
  html += '</div></div>';
  document.getElementById('swe-banner').innerHTML = html;
  startCountdowns();
}

function startCountdowns() {
  document.querySelectorAll('.countdown[data-utc]').forEach(el => {
    const utc = el.dataset.utc;
    function tick() {
      const diff = new Date(utc) - new Date();
      if (diff <= 0) { el.textContent = 'Nu!'; return; }
      const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),
            m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
      el.textContent = d>0?d+'d '+h+'h '+m+'m':h>0?h+'h '+m+'m '+s+'s':m+'m '+s+'s';
      setTimeout(tick,1000);
    }
    tick();
  });
}

function renderFilters(tab, container) {
  const groups = [...new Set(MATCHES.map(m=>m.group).filter(Boolean))].sort();
  const active = activeFilter[tab];
  let html = ['Alla',...groups].map(g => {
    const label = g==='Alla'?'Alla':g.replace('Group ','Gr ');
    return `<button class="filter-btn ${active===g?'active':''}" onclick="setFilter('${tab}','${g}')">${label}</button>`;
  }).join('');
  document.getElementById(container).innerHTML = html;
}

function renderResults() {
  const filter = activeFilter['results'];
  let matches = MATCHES.filter(m=>m.ft).sort((a,b)=>new Date(b.utc)-new Date(a.utc));
  if (filter!=='Alla') matches = matches.filter(m=>m.group===filter);
  document.getElementById('results-count').textContent = MATCHES.filter(m=>m.ft).length;
  document.getElementById('tab-results').innerHTML = matches.length
    ? matches.map(matchRow).join('')
    : '<div class="empty">Inga resultat än</div>';
}

function renderUpcoming() {
  const filter = activeFilter['upcoming'];
  let matches = MATCHES.filter(m=>!m.ft).sort((a,b)=>new Date(a.utc)-new Date(b.utc));
  document.getElementById('upcoming-count').textContent = matches.length;
  if (filter!=='Alla') matches = matches.filter(m=>m.group===filter);
  if (!matches.length) {
    document.getElementById('tab-upcoming').innerHTML = '<div class="empty">Inga kommande matcher</div>';
    return;
  }
  const byDate = {};
  matches.forEach(m => {
    const d = sweTime(m.utc,'date');
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(m);
  });
  let html = '';
  Object.entries(byDate).forEach(([date,ms]) => {
    html += `<div class="date-block"><div class="date-header">${date}</div>${ms.map(matchRow).join('')}</div>`;
  });
  document.getElementById('tab-upcoming').innerHTML = html;
}

function renderGroups() {
  const standings = computeStandings();
  if (!Object.keys(standings).length) {
    document.getElementById('tab-groups').innerHTML = '<div class="empty">Inga resultat att visa tabeller för ännu</div>';
    return;
  }
  let html = '<div class="standing-note">↑ = klart för slutspel (top 2 + 8 bästa tredjeplacerade)</div>';
  Object.keys(standings).sort().forEach(g => {
    html += `<div class="group-table">
      <div class="group-header"><span class="group-name">${g}</span><span class="group-cols">M V O F GF GA GD P</span></div>`;
    standings[g].forEach((t,i) => {
      const gd=t.gf-t.ga, mp=t.w+t.d+t.l, adv=i<2;
      const gdClass = gd>0?'pos':gd<0?'neg':'zero';
      html += `<div class="group-row ${isSwe(t.name)?'sweden':''}">
        <span class="group-pos ${adv?'adv':'not'}">${i+1}${adv?'↑':''}</span>
        <span class="group-team ${isSwe(t.name)?'sweden':'normal'}">${isSwe(t.name)?'🇸🇪 ':''}${t.name}</span>
        ${[mp,t.w,t.d,t.l,t.gf,t.ga].map(v=>`<span class="group-stat">${v}</span>`).join('')}
        <span class="group-gd ${gdClass}">${gd>0?'+'+gd:gd}</span>
        <span class="group-pts">${t.p}</span>
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('tab-groups').innerHTML = html;
}

function renderAll() {
  renderFilters('results','filters-results');
  renderFilters('upcoming','filters-upcoming');
  renderResults();
  renderUpcoming();
  renderGroups();
}

renderBanner();
renderAll();
switchTab('upcoming');
</script>
</body>
</html>
